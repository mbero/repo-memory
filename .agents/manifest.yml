# Knowledge base manifest.
# bootstrap/init.sh writes this file. bootstrap/sync.sh reads it.

template:
  name: project-knowledge-base
  version: "2.0.0"
  installed: "{{TODAY}}"

project:
  name: "{{PROJECT_NAME}}"
  slug: "{{PROJECT_SLUG}}"
  doc_language: "{{DOC_LANGUAGE}}"

# Optional add-ons from profiles/. An enabled profile is linked in AGENTS.md.
profiles: []
  # - kafka
  # - monolith-extraction
  # - spring-boot
  # - frontend
  # - obsidian
  # - jira

# Tool stubs generated at install time. sync.sh refreshes these.
stubs:
  - AGENTS.md
  - CLAUDE.md
  - GEMINI.md
  - .github/copilot-instructions.md
  - .cursor/rules/00-project.mdc

# Per-tool bindings installed at install time.
bindings: []
  # - claude-code
  # - copilot
  # - cursor

# Files the project owns. sync.sh never overwrites these.
owned:
  - docs/**
  - .agents/manifest.yml
